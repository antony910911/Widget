<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#171422"><meta name="apple-mobile-web-app-capable" content="yes"><title>月 Moonchat · 留一點時間給自己</title><link rel="stylesheet" href="./style.css"><script src="./demo-api.js" defer></script><script src="./app.js" defer></script></head><body><main class="app"><aside><a class="brand" href="./">☾ <span>moonchat</span></a><div class="intro"><span class="eyebrow">A LITTLE SPACE FOR YOU</span><h1>今晚，<br>慢慢聊。</h1><p>把一天的喧囂放下，<br>留一點時間給自己。</p></div><label for="scene">我們在哪裡</label><select id="scene"><option>雨夜咖啡館</option><option>海邊散步</option><option>星空露台</option></select><label for="tone">你喜歡的語氣</label><select id="tone"><option>溫柔體貼</option><option>輕鬆幽默</option><option>安靜陪伴</option></select><p class="privacy">這是互動示範版，回覆為預設文字。對話只留在本頁，不會傳送至 AI。</p><button id="clear" class="quiet">↻ 開始新對話</button></aside><section class="conversation"><header><div class="avatar">☾</div><div><strong>月</strong><small>AI 角色 · 浪漫日常陪伴</small></div><span id="mode">確認連線中</span></header><div class="scene-art"><span class="moon"></span><div class="stars">✦ · ˚　　✧　 ·　˚</div><div class="scene-caption"><span>YOUR MOMENT, YOUR PACE</span><h2 id="scene-title">雨夜咖啡館</h2><p>一杯溫熱的茶，和一段不趕時間的對話。</p></div></div><div id="messages" role="log" aria-live="polite" aria-label="聊天訊息"></div><div class="composer"><div id="suggestions"><button>今天有點累，陪我聊聊</button><button>描述一下我們眼前的風景</button></div><form id="chat"><label class="sr-only" for="input">輸入訊息</label><textarea id="input" rows="1" maxlength="2000" placeholder="說說你現在的心情…" required></textarea><button id="send" aria-label="傳送訊息">↑</button></form><p id="notice" role="status">你可以隨時換個情境，或開始新對話。</p></div></section></main></body></html>
